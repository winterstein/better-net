# Deploy bn-server to production via SSH.
# Pattern follows aiqa server-deploy: build in CI, SCP artefacts, swap on host, restart systemd.
name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      # Monorepo: only deploy when server package (or this workflow) changes.
      # The `!` lines exclude docs, which cannot change what runs — a status.md edit used to
      # redeploy the whole server. Order matters: a later pattern overrides an earlier one.
      # GitHub forbids paths-ignore alongside paths, hence negations not a second list.
      - 'bn-server/**'
      - '!bn-server/**.md'
      - 'bn-extension/src/**'   # bn-server/src/bn-extension-src symlinks here
      - '!bn-extension/src/**.md'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:            # manual re-deploy from GitHub Actions UI

concurrency:
  group: deploy-server-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod           # GitHub Environment — holds prod secrets/vars
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || 22 }}
      # Test DB (job-local Postgres service below; not used for production deploy)
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: betternet
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betternet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # bn-server compiles shared code from bn-extension via src/bn-extension-src symlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bn-server/package-lock.json

      - name: Install dependencies
        working-directory: ./bn-server
        run: npm ci

      - name: Run tests
        working-directory: ./bn-server
        run: npm test

      - name: Build server
        working-directory: ./bn-server
        run: npm run build

      - name: Deploy to temporary location
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          # Only ship runtime artefacts; node_modules are installed on the host
          source: "bn-server/dist,bn-server/package.json,bn-server/package-lock.json"
          target: "/opt/betternet/server.new"
          strip_components: 1

      - name: Install dependencies in staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PORT: ${{ vars.SERVER_PORT || '3001' }}
          SERVER_HOST: ${{ vars.SERVER_HOST || '0.0.0.0' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_NAME: ${{ vars.DB_NAME || 'betternet' }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BN_PSEUDONYM_SECRET: ${{ secrets.BN_PSEUDONYM_SECRET }}
          BN_AIQA_ENDPOINT: ${{ vars.BN_AIQA_ENDPOINT }}
          BN_OPENAI_API_KEY: ${{ secrets.BN_OPENAI_API_KEY }}
          BN_ANTHROPIC_API_KEY: ${{ secrets.BN_ANTHROPIC_API_KEY }}
          BN_GOOGLE_API_KEY: ${{ secrets.BN_GOOGLE_API_KEY }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: SERVER_PORT,SERVER_HOST,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,AUTH0_DOMAIN,AUTH0_AUDIENCE,BN_PSEUDONYM_SECRET,BN_AIQA_ENDPOINT,BN_OPENAI_API_KEY,BN_ANTHROPIC_API_KEY,BN_GOOGLE_API_KEY
          script: |
            set -e
            NEW=/opt/betternet/server.new
            if [ ! -f "$NEW/dist/server.js" ]; then
              echo "ERROR: New deployment missing dist/server.js!"
              sudo rm -rf "$NEW"
              exit 1
            fi

            # npm ci here, while the live service is still running. A failed install used
            # to leave the unit stopped because it ran after systemctl stop.
            cd "$NEW"
            echo "Installing production dependencies in staging..."
            npm ci --omit=dev
            if [ ! -d node_modules/fastify ]; then
              echo "ERROR: fastify module not found after installation!"
              exit 1
            fi

            {
              echo "ENVIRONMENT=production"
              echo "PORT=${SERVER_PORT:-3001}"
              echo "HOST=${SERVER_HOST:-0.0.0.0}"
              echo "DB_HOST=${DB_HOST}"
              echo "DB_PORT=${DB_PORT:-5432}"
              echo "DB_NAME=${DB_NAME:-betternet}"
              echo "DB_USERNAME=${DB_USERNAME}"
              echo "DB_PASSWORD=${DB_PASSWORD}"
              [ -n "${AUTH0_DOMAIN}" ] && echo "AUTH0_DOMAIN=${AUTH0_DOMAIN}"
              [ -n "${AUTH0_AUDIENCE}" ] && echo "AUTH0_AUDIENCE=${AUTH0_AUDIENCE}"
              [ -n "${BN_PSEUDONYM_SECRET}" ] && echo "BN_PSEUDONYM_SECRET=${BN_PSEUDONYM_SECRET}"
              [ -n "${BN_AIQA_ENDPOINT}" ] && echo "BN_AIQA_ENDPOINT=${BN_AIQA_ENDPOINT}"
              [ -n "${BN_OPENAI_API_KEY}" ] && echo "BN_OPENAI_API_KEY=${BN_OPENAI_API_KEY}"
              [ -n "${BN_ANTHROPIC_API_KEY}" ] && echo "BN_ANTHROPIC_API_KEY=${BN_ANTHROPIC_API_KEY}"
              [ -n "${BN_GOOGLE_API_KEY}" ] && echo "BN_GOOGLE_API_KEY=${BN_GOOGLE_API_KEY}"
            } > .env
            chmod 600 .env

      - name: Swap live directory and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PORT: ${{ vars.SERVER_PORT || '3001' }}
          RUN_AS_USER: ${{ vars.RUN_AS_USER || vars.DEPLOY_USER }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: SERVER_PORT,RUN_AS_USER
          script: |
            set -e
            NEW=/opt/betternet/server.new
            LIVE=/opt/betternet/server
            PREV=/opt/betternet/server.prev
            CHECK_PORT=${SERVER_PORT:-3001}

            if [ ! -f "$NEW/dist/server.js" ] || [ ! -d "$NEW/node_modules/fastify" ]; then
              echo "ERROR: staging dir is incomplete — leaving the live service running"
              sudo rm -rf "$NEW"
              exit 1
            fi

            sudo systemctl stop bn-server || true
            sudo rm -rf "$PREV"
            if [ -d "$LIVE" ]; then
              sudo mv "$LIVE" "$PREV"
            fi
            sudo mv "$NEW" "$LIVE"

            sudo chown -R ${RUN_AS_USER}:${RUN_AS_USER} "$LIVE"
            sudo chmod 600 "$LIVE/.env"

            sudo systemctl daemon-reload
            sudo systemctl start bn-server

            health_ok=
            for attempt in $(seq 1 30); do
              if ! systemctl is-active --quiet bn-server; then
                echo "ERROR: bn-server not active after restart (attempt ${attempt})"
                systemctl status bn-server --no-pager -l || true
                journalctl -u bn-server -n 30 --no-pager || true
                break
              fi
              if curl -fsS --max-time 5 "http://127.0.0.1:${CHECK_PORT}/health" > /dev/null; then
                echo "Health check passed on port ${CHECK_PORT} after ${attempt} attempt(s)"
                health_ok=1
                break
              fi
              sleep 2
            done

            if [ -n "$health_ok" ]; then
              sudo rm -rf "$PREV"
              exit 0
            fi

            echo "ERROR: health check failed — rolling back to the previous deployment"
            systemctl status bn-server --no-pager -l || true
            journalctl -u bn-server -n 30 --no-pager || true
            if [ -d "$PREV" ]; then
              sudo systemctl stop bn-server || true
              sudo rm -rf "$LIVE"
              sudo mv "$PREV" "$LIVE"
              sudo systemctl start bn-server
            fi
            exit 1
